name: Build NJS APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Keystore (Optional)
        id: keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "Using custom upload key from secrets..."
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No custom keystore secret found. Using bundled fallback keystore..."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APKs with Gradle
        run: |
          if [ "${{ steps.keystore.outputs.has_keystore }}" = "true" ]; then
            export ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
            export ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_STORE_PASSWORD="${{ secrets.UPLOAD_STORE_PASSWORD }}"
            export ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_KEY_ALIAS="${{ secrets.UPLOAD_KEY_ALIAS }}"
            export ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_KEY_PASSWORD="${{ secrets.UPLOAD_KEY_PASSWORD }}"
          fi
          ./gradlew :app:assembleRelease -PallAbis

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NJS-Release-APKs
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "NJS $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
